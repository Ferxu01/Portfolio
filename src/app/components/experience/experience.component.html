<section id="experience" class="experience-section">
  <div class="experience-section__container">
    <h2 class="experience-section__title">Experiencia</h2>

    <div class="experience-section__grid">
      @for (card of experienceCards; track card.id) {
        <article class="experience-card">
          <div class="experience-card__icon-wrapper">
            <img
              [src]="card.icon"
              [alt]="card.title"
              width="160"
              height="160"
              class="experience-card__icon"
            />
          </div>

          <div class="experience-card__content">
            <h3 class="experience-card__title">
              {{ card.title }}
            </h3>

            <p class="experience-card__description">
              {{ card.description }}
            </p>

            <a
              [href]="card.link"
              target="_blank"
              rel="noopener noreferrer"
              class="experience-card__link"
            >
              SABER MÁS &rarr;
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
