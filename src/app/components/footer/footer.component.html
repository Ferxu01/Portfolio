<footer id="contact" class="footer">
  <div class="footer__container">
    <!-- Encabezado de Contacto -->
    <div class="footer__content">
      <h2 class="footer__title">{{ 'CONTACT' | transloco }}</h2>

      <p class="footer__description">
        {{ 'FOOTER_DESCRIPTION' | transloco }}
      </p>

      @if (displayedEmail()) {
        <a class="footer__email" [href]="mailtoEmailLink()" (click)="revealEmail()">
          <svg
            class="footer__email-icon"
            fill="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M1.5 4.5a3 3 0 0 1 3-3h15a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3h-15a3 3 0 0 1-3-3v-15Zm3-1.5a1.5 1.5 0 0 0-1.5 1.5v.724l9 5.4 9-5.4V4.5a1.5 1.5 0 0 0-1.5-1.5h-15Zm16.5 4.226-8.583 5.15a.75.75 0 0 1-.834 0L3 7.226V19.5a1.5 1.5 0 0 0 1.5 1.5h15a1.5 1.5 0 0 0 1.5-1.5V7.226Z"
            />
          </svg>
          <span>{{ displayedEmail() }}</span>
        </a>
      } @else {
        <button
          class="footer__email-btn"
          type="button"
          (click)="revealEmail()"
          (focus)="revealEmail()"
        >
          <svg
            class="footer__email-icon"
            fill="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M1.5 4.5a3 3 0 0 1 3-3h15a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3h-15a3 3 0 0 1-3-3v-15Zm3-1.5a1.5 1.5 0 0 0-1.5 1.5v.724l9 5.4 9-5.4V4.5a1.5 1.5 0 0 0-1.5-1.5h-15Zm16.5 4.226-8.583 5.15a.75.75 0 0 1-.834 0L3 7.226V19.5a1.5 1.5 0 0 0 1.5 1.5h15a1.5 1.5 0 0 0 1.5-1.5V7.226Z"
            />
          </svg>
          <span>{{ 'SHOW_EMAIL' | transloco }}</span>
        </button>
      }
    </div>

    <!-- Redes Sociales -->
    <div class="footer__socials">
      @for (social of socialLinks; track social.name) {
        <a
          class="footer__social-link"
          [href]="social.link"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="social.name"
          [title]="social.name"
        >
          <svg
            class="footer__social-icon footer__social-icon--svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path [attr.d]="social.svgPath" />
          </svg>
        </a>
      }
    </div>

    <!-- Copyright -->
    <div class="footer__copyright">
      <p class="footer__copyright-text">
        &copy; {{ currentYear }} {{ 'FULL_NAME' | transloco }}.
        {{ 'ALL_RIGHTS_RESERVED' | transloco }}
      </p>
    </div>
  </div>
</footer>
