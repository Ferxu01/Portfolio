<header class="header">
  <nav class="header__nav">
    <div class="header__container">
      <!-- Logo -->
      <a routerLink="/" class="header__brand">
        <img class="header__logo" src="assets/logo/logo.png" alt="Logo" width="100" height="100" />
      </a>

      <!-- Nav links -->
      <ul class="header__menu">
        @for (link of links; track link.id) {
          <li class="header__item">
            <a [href]="'#' + link.id" class="header__link"> {{ link.label | transloco }} </a>
          </li>
        }
      </ul>

      <app-theme-toggle />
      <app-lang-selector />
    </div>
  </nav>
</header>

<button
  class="scroll-top-btn"
  [class.scroll-top-btn--visible]="showScrollTop()"
  type="button"
  (click)="scrollToTop()"
  [attr.aria-label]="'SCROLL_TO_TOP' | transloco"
  [title]="'SCROLL_TO_TOP' | transloco"
>
  <svg
    class="scroll-top-btn__icon"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2.5"
      d="M5 10l7-7m0 0l7 7m-7-7v18"
    />
  </svg>
</button>
