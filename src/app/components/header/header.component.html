<header class="header">
  <nav class="header__nav">
    <div class="header__container">
      <!-- Logo -->
      <a routerLink="/" class="header__brand">
        <img class="header__logo" src="assets/logo/logo.png" alt="Logo" width="100" height="100" />
      </a>

      <!-- Nav links -->
      <ul class="header__menu" [class.header__menu--open]="isMenuOpen()">
        @for (link of links; track link.id) {
          <li class="header__item">
            <a [href]="'#' + link.id" class="header__link"> {{ link.label | transloco }} </a>
          </li>
        }
      </ul>

      <div class="header__actions">
        <app-theme-toggle />
        <app-lang-selector />

        <!-- Hamburger button for mobile -->
        <button
          type="button"
          class="header__toggle"
          (click)="toggleMenu()"
          [attr.aria-label]="'TOGGLE_MENU' | transloco"
          [attr.aria-expanded]="isMenuOpen()"
        >
          @if (isMenuOpen()) {
            <!-- X Icon -->
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          } @else {
            <!-- 3 Bars Icon -->
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          }
        </button>
      </div>
    </div>
  </nav>
</header>

<button
  class="scroll-top-btn"
  [class.scroll-top-btn--visible]="showScrollTop()"
  type="button"
  (click)="scrollToTop()"
  [attr.aria-label]="'SCROLL_TO_TOP' | transloco"
  [title]="'SCROLL_TO_TOP' | transloco"
>
  <svg
    class="scroll-top-btn__icon"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2.5"
      d="M5 10l7-7m0 0l7 7m-7-7v18"
    />
  </svg>
</button>
