<button
  class="theme-toggle"
  type="button"
  (click)="toggleTheme()"
  [title]="(isDarkTheme() ? 'DARK_THEME' : 'LIGHT_THEME') | transloco"
  [attr.aria-label]="(isDarkTheme() ? 'DARK_THEME' : 'LIGHT_THEME') | transloco"
>
  @if (isDarkTheme()) {
    <!-- Moon Icon -->
    <svg
      class="theme-toggle__icon"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
      />
    </svg>
  } @else {
    <!-- Sun Icon -->
    <svg
      class="theme-toggle__icon"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414M18.364 18.364l-1.414-1.414M7.05 7.05L5.636 5.636M12 8a4 4 0 100 8 4 4 0 000-8z"
      />
    </svg>
  }
</button>
